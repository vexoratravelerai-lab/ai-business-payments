name: PayPal Monitor Logic Test

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - ".github/workflows/paypal-monitor.yml"
      - ".github/workflows/paypal-monitor-logic-test.yml"
      - "scripts/paypal-monitor-logic-test.sh"
  workflow_dispatch:

jobs:
  test-monitor-logic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run isolated PayPal monitor logic harness
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/paypal-monitor-logic-test.sh

      - name: Verify production workflow file is tracked
        shell: bash
        run: |
          set -euo pipefail
          test -s .github/workflows/paypal-monitor.yml
          test -s scripts/paypal-monitor-logic-test.sh
          echo "PASS: production workflow and harness are present."
