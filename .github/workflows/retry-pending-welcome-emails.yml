name: Retry Pending Welcome Emails

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/pending_welcome_emails.json"
      - ".github/workflows/retry-pending-welcome-emails.yml"

concurrency:
  group: paypal-payment-monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  retry-pending:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Retry queued welcome emails
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_ADDRESS: ${{ secrets.RESEND_FROM_ADDRESS }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${RESEND_API_KEY:-}" ] || [ -z "${RESEND_FROM_ADDRESS:-}" ]; then
            echo "Welcome email retry is waiting for RESEND_API_KEY and a verified RESEND_FROM_ADDRESS."
            exit 0
          fi

          FILE="data/pending_welcome_emails.json"
          test -f "$FILE" || printf '[]\n' > "$FILE"

          COUNT="$(jq 'length' "$FILE")"
          if [ "$COUNT" -eq 0 ]; then
            echo "No pending welcome emails."
            exit 0
          fi

          jq -c '.[]' "$FILE" | while IFS= read -r item; do
            TX_ID="$(printf '%s' "$item" | jq -r '.transaction_id')"
            PAYER_EMAIL="$(printf '%s' "$item" | jq -r '.payer_email // ""')"
            PAYER_NAME="$(printf '%s' "$item" | jq -r '.payer_name // ""')"

            if [ -z "$PAYER_EMAIL" ] || [ "$PAYER_EMAIL" = "null" ]; then
              echo "Pending item $TX_ID has no payer email; keeping it queued."
              continue
            fi

            SAFE_NAME="$(printf '%s' "$PAYER_NAME" | sed 's/[&<>]/ /g')"
            HTML="<p>مرحبًا ${SAFE_NAME:-عميلنا الكريم}،</p><p>شكرًا لك على تأكيد الدفع.</p><p>تم تسجيل دفعتك وفتح ملف بدء التنفيذ الخاص بك.</p><p><strong>الخطوة التالية:</strong></p><ol><li>مراجعة صفحة الخدمة.</li><li>اختيار وقت الاجتماع من رابط Calendly.</li><li>جمع المعلومات الأساسية عن نشاطك.</li><li>بدء إعداد الأتمتة ومتابعة أول نتيجة.</li></ol><p><a href=\"https://149402759.hs-sites-eu1.com/home-service-ai-automation\">مراجعة صفحة الخدمة</a></p><p><a href=\"https://calendly.com/vexora-traveler-ai/30min\">احجز موعد الاجتماع من هنا</a></p><p>تحياتي،<br>Vexora AI</p>"
            PAYLOAD="$(jq -n --arg from "$RESEND_FROM_ADDRESS" --arg to "$PAYER_EMAIL" --arg subject "AI Business — Welcome & Next Step" --arg html "$HTML" '{from:$from,to:[$to],subject:$subject,html:$html}')"

            STATUS="$(curl -sS --retry 3 -o /tmp/resend-response.json -w "%{http_code}" -X POST -H "Authorization: Bearer $RESEND_API_KEY" -H "Content-Type: application/json" -H "Idempotency-Key: paypal-$TX_ID-welcome-v1" --data "$PAYLOAD" "https://api.resend.com/emails")"
            echo "Pending welcome email retry for PayPal transaction $TX_ID: HTTP $STATUS"

            if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 300 ]; then
              TMP="$(mktemp)"
              jq --arg tx "$TX_ID" 'map(select(.transaction_id != $tx))' "$FILE" > "$TMP"
              mv "$TMP" "$FILE"
            else
              jq . /tmp/resend-response.json 2>/dev/null || cat /tmp/resend-response.json
              exit 1
            fi
          done

      - name: Save pending email queue
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pending_welcome_emails.json
          if git diff --cached --quiet; then
            echo "No pending email queue changes."
            exit 0
          fi
          git commit -m "chore: retry pending welcome emails"
          git push
