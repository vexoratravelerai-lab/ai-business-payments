name: Resend Email Smoke Test

on:
  workflow_dispatch:
    inputs:
      recipient:
        description: "Email address to use for the test"
        required: true
        default: "delivered@resend.dev"

permissions:
  contents: read

jobs:
  send-test-email:
    runs-on: ubuntu-latest
    steps:
      - name: Send test email with Resend
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          TEST_RECIPIENT: ${{ inputs.recipient }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${RESEND_API_KEY:-}" ]; then
            echo "Missing GitHub repository secret: RESEND_API_KEY."
            exit 1
          fi

          if [ -z "${TEST_RECIPIENT:-}" ]; then
            echo "Missing workflow input: recipient."
            exit 1
          fi

          PAYLOAD="$(jq -n \
            --arg from "Vexora AI <onboarding@resend.dev>" \
            --arg to "${TEST_RECIPIENT}" \
            --arg subject "Vexora AI — Resend Smoke Test" \
            --arg text "Resend API test from GitHub Actions. This verifies the same sender and API path used by the customer welcome-email step." \
            '{from:$from,to:[$to],subject:$subject,text:$text}')"

          STATUS="$(curl -sS --retry 3 -o /tmp/resend-test.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${RESEND_API_KEY}" \
            -H "Content-Type: application/json" \
            --data "${PAYLOAD}" \
            "https://api.resend.com/emails")"

          echo "Resend smoke test to ${TEST_RECIPIENT} HTTP status: ${STATUS}"
          cat /tmp/resend-test.json

          if [ "${STATUS}" -lt 200 ] || [ "${STATUS}" -ge 300 ]; then
            exit 1
          fi
