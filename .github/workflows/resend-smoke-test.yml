name: Resend Email Smoke Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send-test-email:
    runs-on: ubuntu-latest
    steps:
      - name: Send test email with Resend
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${RESEND_API_KEY:-}" ]; then
            echo "Missing GitHub repository secret: RESEND_API_KEY."
            exit 1
          fi

          PAYLOAD="$(jq -n             --arg from "Vexora AI <onboarding@resend.dev>"             --arg to "delivered@resend.dev"             --arg subject "Vexora AI — Resend Smoke Test"             --arg text "Resend API test from GitHub Actions. If this workflow succeeds, the Resend API key and test sender are accepted."             '{from:$from,to:[$to],subject:$subject,text:$text}')"

          STATUS="$(curl -sS --retry 3 -o /tmp/resend-test.json -w "%{http_code}"             -X POST             -H "Authorization: Bearer ${RESEND_API_KEY}"             -H "Content-Type: application/json"             --data "${PAYLOAD}"             "https://api.resend.com/emails")"

          echo "Resend smoke test HTTP status: ${STATUS}"
          cat /tmp/resend-test.json
          if [ "${STATUS}" -lt 200 ] || [ "${STATUS}" -ge 300 ]; then
            exit 1
          fi
